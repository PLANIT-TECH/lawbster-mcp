name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true

jobs:
  publish:
    name: Build & publish @planit-tech/primamcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # provenance attestation (auth itself runs via NPM_TOKEN)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: packages/primamcp/package-lock.json

      # --provenance needs a recent npm; Node 22 ships an older one.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/primamcp/package.json', 'utf8'));
            const expected = `refs/tags/v${pkg.version}`;
            if (context.ref !== expected) {
              core.setFailed(`Tag ${context.ref} does not match package.json version ${pkg.version} (expected ${expected}). Bump package.json before tagging.`);
            }

      - name: Install
        working-directory: packages/primamcp
        run: npm ci

      - name: Build
        working-directory: packages/primamcp
        run: npm run build

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        working-directory: packages/primamcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --dry-run --access public

      # Auth runs via the NPM_TOKEN secret, not OIDC: a trusted publisher cannot be
      # configured for a package that does not exist yet, so the first release of
      # @planit-tech/primamcp needs a granular access token with read-and-write on
      # the @planit-tech scope. Once the package exists, configure a trusted
      # publisher on npmjs.com and this can go back to tokenless OIDC.
      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        working-directory: packages/primamcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

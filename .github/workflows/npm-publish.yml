name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true

jobs:
  publish:
    name: Build & publish @planit-lawbster/lawbster-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC token for npm Trusted Publishing (auth + provenance, no NPM_TOKEN)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: packages/lawbster-mcp/package-lock.json

      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('packages/lawbster-mcp/package.json', 'utf8'));
            const expected = `refs/tags/v${pkg.version}`;
            if (context.ref !== expected) {
              core.setFailed(`Tag ${context.ref} does not match package.json version ${pkg.version} (expected ${expected}). Bump package.json before tagging.`);
            }

      - name: Install
        working-directory: packages/lawbster-mcp
        run: npm ci

      - name: Build
        working-directory: packages/lawbster-mcp
        run: npm run build

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        working-directory: packages/lawbster-mcp
        run: npm publish --dry-run --access public

      # Auth + provenance happen automatically via OIDC Trusted Publishing — no NPM_TOKEN.
      # Prerequisite: a trusted publisher for this repo + workflow is configured on npmjs.com.
      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run)
        working-directory: packages/lawbster-mcp
        run: npm publish --access public

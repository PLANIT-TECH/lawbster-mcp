<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Lawbster — Verified German &amp; EU Law for any AI Assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000a4d"/>
      <stop offset="60%" stop-color="#001489"/>
      <stop offset="100%" stop-color="#0a2cb3"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#a5f4b2" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <g transform="translate(80, 168)">
    <text x="0" y="92" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#a5f4b2" letter-spacing="-3">//</text>
    <text x="148" y="92" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-2.5">LAWBSTER</text>
  </g>

  <text x="80" y="368" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#ffffff">Verified, citable German &amp; EU law</text>
  <text x="80" y="412" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="500" fill="#a5f4b2">for any MCP-capable AI assistant</text>

  <g transform="translate(80, 488)">
    <rect x="0" y="0" width="180" height="48" rx="24" ry="24" fill="#a5f4b2" fill-opacity="0.12" stroke="#a5f4b2" stroke-opacity="0.4"/>
    <text x="90" y="32" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#a5f4b2" text-anchor="middle">BGB · GDPR · AI Act</text>

    <rect x="200" y="0" width="200" height="48" rx="24" ry="24" fill="#a5f4b2" fill-opacity="0.12" stroke="#a5f4b2" stroke-opacity="0.4"/>
    <text x="300" y="32" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#a5f4b2" text-anchor="middle">BGH · BVerfG · CJEU</text>

    <rect x="420" y="0" width="220" height="48" rx="24" ry="24" fill="#a5f4b2" fill-opacity="0.12" stroke="#a5f4b2" stroke-opacity="0.4"/>
    <text x="530" y="32" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="600" fill="#a5f4b2" text-anchor="middle">Hosted in Germany 🇩🇪</text>
  </g>

  <text x="1200" y="600" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#ffffff" fill-opacity="0.5" text-anchor="end">lawbster.planitprima.com</text>
